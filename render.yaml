# Budget Buddy - Render Full-Stack Deployment with Supabase
# Deploy this file by connecting your GitHub repo to Render
#
# IMPORTANT: This configuration uses Supabase PostgreSQL as the primary database.
# Set the following environment variables in Render Dashboard:
# - DATABASE_URL: postgresql+asyncpg://postgres:password@your-project.supabase.co:5432/postgres
# - ADMIN_API_KEY: (generate secure random value)
# - SUPABASE_S3_* credentials for storage

services:
  # Backend FastAPI Service
  - type: web
    name: budgetbuddy-backend
    env: python
    plan: free
    region: oregon
    rootDir: backend-fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    timeout: 30
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        sync: false
        description: "Supabase PostgreSQL connection string (required)"
      - key: SECRET_KEY
        sync: false
        generateValue: true
        description: "Secret key for JWT token signing"
      - key: ADMIN_API_KEY
        sync: false
        description: "Admin API key for security endpoints"
      - key: GEMINI_API_KEY
        sync: false
        description: "Google Gemini API key for AI assistant"
      - key: CORS_ORIGINS
        value: 'https://budgetbuddy-student.vercel.app,https://frontend-iota-black-70.vercel.app,http://localhost:5173,https://budgetbuddy-frontend.onrender.com'
      - key: STORAGE_BACKEND
        value: 'supabase'
      - key: DEBUG
        value: 'false'
      - key: SMTP_HOST
        sync: false
        description: "SMTP server used to send email verification codes"
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: 'true'
      - key: AUTO_MIGRATE
        value: 'true'
      - key: LOCAL_STORAGE_DIR
        value: '/app/media'
      - key: SUPABASE_S3_ENDPOINT
        sync: false
        description: "Supabase S3 endpoint"
      - key: SUPABASE_S3_REGION
        value: 'ap-southeast-1'
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: 'reports'
      - key: SUPABASE_SIGNED_URL_TTL
        value: '300'
    autoDeploy: true
    branches:
      main:
        enabled: true

  # Frontend Static Site
  - type: web
    name: budgetbuddy-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://budgetbuddy-backend.onrender.com
    autoDeploy: true
    branches:
      main:
        enabled: true

# Note: Supabase PostgreSQL is used instead of Render's managed PostgreSQL
# databases section removed - use Supabase for database

